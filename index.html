<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <form action="" class="calculator">
        <section class="display">
            <output></output>
        </section>
        <section class="input">
            <div class="upperBlock">
                <div class="mainCotrollers">
                    <button type="button">GT</button><button type="button">→</button><button type="button">CE</button><button type="button">⏻</button>
                </div>
            </div>
            <div class="lowerBlock">
                <div class="numbers">
                    <div class="top">
                        <div class="firstRow"><button type="button">7</button><button type="button">8</button><button type="button">9</button></div>
                        <div class="secondRow"><button type="button">4</button><button type="button">5</button><button type="button">6</button></div>
                        <div class="thirdRow"><button type="button">1</button><button type="button">2</button><button type="button">3</button></div>
                    </div>
                    <div class="bottom">
                        <div class="equalZeroDeceml">
                        <button type="button">0</button><button type="button">.</button><button type="button">=</button>
                    </div>
                </div>
                </div>
                <div class="operators">
                    <button type="button">÷</button><button type="button">x</button><button type="button">+</button><button type="button">-</button>
                </div>
            </div>
        </section>
    </form>
</body>
</html>
